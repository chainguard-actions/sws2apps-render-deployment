name: Test basic usage - invalid credentials
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with fake credentials (expect failure)
        id: action
        uses: .
        with:
          serviceId: srv-fake-service-id-for-testing
          apiKey: fake-api-key-for-testing
          multipleDeployment: true
        continue-on-error: true
      - name: Assert action ran (failed due to invalid credentials, not missing input)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran and failed as expected with invalid credentials"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded unexpectedly (maybe a mock environment)"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
