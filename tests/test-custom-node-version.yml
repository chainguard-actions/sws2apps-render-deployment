name: Test custom node-version input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          serviceId: "srv-fake-service-id-for-testing"
          apiKey: "rnd_fakekeyfortesting1234567890"
          node-version: "20.x"
          cli-version: "2.2.0"

      - name: Assert action failed at deploy step (not at node setup)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid credentials, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed at deploy step"

      - name: Assert Node.js 20.x was set up
        run: |
          if ! command -v node &>/dev/null; then
            echo "FAIL: node was not found after action ran"
            exit 1
          fi
          NODE_VER=$(node --version)
          echo "node version: $NODE_VER"
          MAJOR=$(node --version | sed 's/v\([0-9]*\).*/\1/')
          echo "node major version: $MAJOR"
          if [ "$MAJOR" != "20" ]; then
            echo "FAIL: expected Node.js major version 20, got $MAJOR"
            exit 1
          fi
          echo "PASS: Node.js 20.x is active"

      - name: Assert render CLI was installed
        run: |
          if ! command -v render &>/dev/null; then
            echo "FAIL: render CLI was not installed"
            exit 1
          fi
          echo "render CLI version: $(render --version 2>/dev/null || echo 'version flag not supported')"
          echo "PASS: render CLI is installed"
