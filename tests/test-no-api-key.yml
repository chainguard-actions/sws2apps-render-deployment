name: Test without optional apiKey input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action without apiKey (expect failure due to missing/invalid credentials)
        id: action
        uses: .
        with:
          serviceId: srv-fake-service-id-for-testing
        continue-on-error: true
      - name: Assert action ran (failed due to missing/invalid credentials, not a crash)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran and failed as expected without apiKey"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded unexpectedly (maybe a mock environment)"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
