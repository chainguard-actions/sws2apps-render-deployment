name: Test missing API key handling
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action without apiKey
        id: action
        uses: .
        continue-on-error: true
        with:
          serviceId: 'srv-invalid-test-id'
          multipleDeployment: 'false'

      - name: Assert action failed due to missing API key
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail without a valid API key, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed without API key"
