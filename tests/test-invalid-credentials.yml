name: Test invalid credentials fail at deploy step
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Verify render CLI is not yet installed
        run: |
          if command -v render &>/dev/null; then
            echo "WARN: render CLI already present before action runs"
          else
            echo "render CLI not present yet (expected)"
          fi

      - id: action
        uses: .
        continue-on-error: true
        with:
          serviceId: "srv-fake-service-id-for-testing"
          apiKey: "rnd_fakekeyfortesting1234567890"
          node-version: "lts/Krypton"
          cli-version: "2.2.0"

      - name: Assert action failed (expected with fake credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid credentials, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid credentials"

      - name: Assert render CLI was installed by the action
        run: |
          if ! command -v render &>/dev/null; then
            echo "FAIL: render CLI was not installed by the action"
            exit 1
          fi
          echo "render CLI found at: $(which render)"
          render --version || true
          echo "PASS: render CLI is installed"

      - name: Assert Node.js was set up by the action
        run: |
          if ! command -v node &>/dev/null; then
            echo "FAIL: node was not found after action ran"
            exit 1
          fi
          NODE_VER=$(node --version)
          echo "node version: $NODE_VER"
          echo "PASS: Node.js is available"
