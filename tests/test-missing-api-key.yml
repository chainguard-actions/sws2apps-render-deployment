name: Test missing apiKey
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action without apiKey (expect failure)
        id: action
        uses: .
        with:
          serviceId: 'srv-test-service-id'
          apiKey: ''
        continue-on-error: true

      - name: Assert action failed due to missing apiKey
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when apiKey is missing, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when apiKey was missing"
