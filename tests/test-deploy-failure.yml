name: Test deploy failure handling (mocked)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up fake render CLI that simulates failure
        run: |
          # Create a fake install script that installs a render binary that fails
          cat > /tmp/fake-install-render-fail.sh << 'EOF'
          #!/bin/sh
          BINDIR="/usr/local/bin"
          prev=""
          for arg in "$@"; do
            case "$prev" in
              -b) BINDIR="$arg" ;;
            esac
            prev="$arg"
          done
          cat > "$BINDIR/render" << 'RENDEREOF'
          #!/bin/sh
          echo "Error: Service not found or unauthorized" >&2
          exit 1
          RENDEREOF
          chmod +x "$BINDIR/render"
          EOF
          chmod +x /tmp/fake-install-render-fail.sh

          # Create a fake curl that serves our failing install script
          mkdir -p /tmp/fake-bin
          cat > /tmp/fake-bin/curl << 'EOF'
          #!/bin/sh
          # Fake curl: intercept render install.sh, fall through for others
          out=""
          prev=""
          for arg in "$@"; do
            case "$prev" in
              -o|--output) out="$arg" ;;
            esac
            prev="$arg"
          done
          case "$*" in
            *render-oss*install.sh*|*install.sh*render*)
              if [ -n "$out" ]; then
                cat /tmp/fake-install-render-fail.sh > "$out"
              else
                cat /tmp/fake-install-render-fail.sh
              fi
              exit 0
              ;;
          esac
          exec /usr/bin/curl "$@"
          EOF
          chmod +x /tmp/fake-bin/curl

          echo "/tmp/fake-bin" >> "$GITHUB_PATH"

      - name: Run action expecting failure
        id: deploy
        uses: .
        continue-on-error: true
        with:
          serviceId: 'srv-invalid-service'
          apiKey: 'rnd_invalid_key'
          node-version: 'lts/Krypton'
          cli-version: '2.2.0'

      - name: Assert action failed as expected
        env:
          OUTCOME: ${{ steps.deploy.outcome }}
        run: |
          echo "Step outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed when render CLI returned error"
          else
            echo "FAIL: expected action to fail but got outcome: $OUTCOME"
            exit 1
          fi
